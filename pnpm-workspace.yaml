allowBuilds:
  # @arts git deps: allow their npm "prepare" (their dist is committed; grb's
  # prepare is just husky). Strict pnpm keys git deps by resolved tarball, so
  # the hash-pinned keys are needed alongside the unscoped ones; bump the hash
  # if a pin changes.
  '@arts/github-release-browser': true
  '@arts/github-release-browser@https://codeload.github.com/artkrsk/github-release-browser/tar.gz/72aef1a6e4ab50ef021fce9602c1f3c22cccd2b9': true
  '@arts/release-deploy-core': true
  '@arts/release-deploy-core@https://codeload.github.com/artkrsk/arts-release-deploy-core/tar.gz/f777d075ca1a5cade3694aa78e0369a16f574860': true
  # sass pulls @parcel/watcher for its own CLI --watch, which this build never uses
  '@parcel/watcher': false
  esbuild: true
  # lefthook's binary rides its optionalDependencies, not this script — all the
  # postinstall does is write .git/hooks, which package.json#prepare does explicitly.
  lefthook: false
