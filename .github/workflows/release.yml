name: Release Plugin

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    uses: artkrsk/wordpress-plugin-workflows/.github/workflows/release.yml@main
    with:
      node_version: '24'
      php_version: '8.4'
      build_command: 'composer install --prefer-dist --no-progress && pnpm build'
      plugin_slug: 'release-deploy-edd'
      main_plugin_file: 'src/wordpress-plugin/release-deploy-edd.php'
      use_arts_changelog: true
      assets_directory: '.wordpress-org'
      version_files: '["plugin_header", "readme.txt", "package.json"]'
      # Live on wp.org; SVN secrets are set on this repo.
      deploy_to_wordpress: true
    secrets:
      SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
      SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
